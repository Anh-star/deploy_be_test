# Application Configuration
spring.application.name=itstudy

# ============================================
# DATASOURCE CONFIGURATION
# ============================================
# Replace the following placeholders with your actual database credentials:
# <SERVER> - Your SQL Server hostname or IP address (e.g., localhost or 192.168.1.100)
# <PORT> - Your SQL Server port (default is 1433)
# <DB_NAME> - Your database name (e.g., itstudy_db)
# <USERNAME> - Your SQL Server username
# <PASSWORD> - Your SQL Server password
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=itstudy_db_local;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:TAIKHOAN}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:MATKHAU}

#spring.datasource.url=jdbc:sqlserver://cmcsv.ric.vn:22956;databaseName=CMC26_S4_NHOM5;encrypt=true;trustServerCertificate=true
#spring.datasource.username=cmcsv
#spring.datasource.password=Cm!@#1234Cu
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# ============================================
# HIKARICP CONNECTION POOL CONFIGURATION
# ============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# ============================================
# JWT CONFIGURATION
# ============================================
# JWT secret key (Base64 encoded, must be at least 256 bits/32 bytes for HS256 algorithm)
# In production, use a strong, randomly generated secret key
# This is a Base64 encoded secret key (32 bytes = 44 Base64 characters)

# JWT CONFIG
jwt.secret=${JWT_SECRET:testsecretkeytestsecretkeytestsecretkey123456}
jwt.access-token-expiration-seconds=900
jwt.refresh-token-expiration-seconds=604800
