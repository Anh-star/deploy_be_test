# Application Configuration
spring.application.name=itstudy
server.port=${PORT:8080}

# ============================================
# DATASOURCE CONFIGURATION
# ============================================
# Replace the following placeholders with your actual database credentials:
# <SERVER> - Your SQL Server hostname or IP address (e.g., localhost or 192.168.1.100)
# <PORT> - Your SQL Server port (default is 1433)
# <DB_NAME> - Your database name (e.g., itstudy_db)
# <USERNAME> - Your SQL Server username
# <PASSWORD> - Your SQL Server password
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=svthayvu2026;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HTTP Servlet Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# ============================================
# HIKARICP CONNECTION POOL CONFIGURATION
# ============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=15000

# ============================================
# JWT CONFIGURATION
# ============================================
# JWT secret key (Base64 encoded, must be at least 256 bits/32 bytes for HS256 algorithm)
# In production, use a strong, randomly generated secret key
# This is a Base64 encoded secret key (32 bytes = 44 Base64 characters)

# JWT CONFIG
jwt.secret=${JWT_SECRET:testsecretkeytestsecretkeytestsecretkey123456}
jwt.access-token-expiration-seconds=900
jwt.refresh-token-expiration-seconds=604800

